name: Publish and probe darning load-path release final

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-darning-load-path-5-final.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: darning-load-path-publish
  cancel-in-progress: false

jobs:
  publish-and-probe:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the sealed tree
        run: |
          set -euo pipefail
          grep -q '2026-08-16.load-path-5' darning-simulator/index.html
          grep -q '"status": "passed"' darning-simulator/validation.json
          node --check darning-simulator/mechanics.js
          node --check darning-simulator/palette.js
          node --check darning-simulator/worker.js
          node --check darning-simulator/app.js
          node tests/mechanics_smoke.mjs
          node tests/palette_smoke.mjs
          node tests/worker_smoke.mjs
          node tests/site_smoke.mjs
          node tests/ui_contract_smoke.mjs
      - name: Prepare Pages artifact
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Preserve exact authorship while removing one-shot workflows
        env:
          BASE_COMMIT: c6146202566104ad18f1cfe50e6945d9557fadad
          EXPECTED_MAIN: ${{ github.sha }}
          GIT_AUTHOR_NAME: M Domenzain
          GIT_AUTHOR_EMAIL: git@domenza.in
          GIT_COMMITTER_NAME: M Domenzain
          GIT_COMMITTER_EMAIL: git@domenza.in
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name '*darning*.yml' -delete
          git add -A
          git reset --soft "$BASE_COMMIT"
          git commit -m 'Model anchored anisotropic load paths'
          test "$(git show -s --format=%an HEAD)" = 'M Domenzain'
          test "$(git show -s --format=%ae HEAD)" = 'git@domenza.in'
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN" origin HEAD:main
          printf '%s' "$(git rev-parse HEAD)" > /tmp/release-sha
      - name: Request a branch-backed Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /tmp/pages-build.json \
            --write-out '%{http_code}\n' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || true
      - name: Probe the deployed worker build
        run: |
          set -euo pipefail
          release_sha=$(cat /tmp/release-sha)
          for attempt in $(seq 1 30); do
            index=$(curl --fail --silent --show-error "https://domenzain.github.io/darning-simulator/index.html?release=$release_sha" || true)
            worker=$(curl --fail --silent --show-error "https://domenzain.github.io/darning-simulator/worker.js?release=$release_sha" || true)
            mechanics=$(curl --fail --silent --show-error "https://domenzain.github.io/darning-simulator/mechanics.js?release=$release_sha" || true)
            if grep -q '2026-08-16.load-path-5' <<<"$index" \
              && grep -q 'if(code!==1)' <<<"$worker" \
              && grep -q 'solveEquilibrium' <<<"$mechanics"; then
              printf 'deployed build %s verified on attempt %s\n' "$release_sha" "$attempt"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages did not expose the sealed build within the probe window' >&2
          exit 1
